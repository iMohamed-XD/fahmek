[project]
name = "rag-service"
version = "0.1.0"
description = "Fahemak (فاهمك) — Arabic-first RAG document understanding service"
readme = "README.md"
authors = [
    { name = "Mohamad Firas Amin", email = "mohammad.ferasamin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # --- Web framework / server ---
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "python-multipart>=0.0.32",
    "scalar-fastapi>=1.8.2",

    # --- Settings / validation ---
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "email-validator>=2.3.0",

    # --- Database / ORM / migrations ---
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "asyncpg>=0.31.0",
    "alembic>=1.19.0",
    "pgvector>=0.5.0",

    # --- Auth ---
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1", 

    # --- Async jobs ---
    "arq>=0.26",
    "redis>=5.0",

    # --- RAG pipeline ---
    "sentence-transformers>=5.6.1",
    "sentencepiece>=0.2.0",
    "torch>=2.0",
    "langchain-text-splitters>=1.1.2",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",

    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "faker>=40.36.0",
    "pytest>=8.0.0",
    "httpx>=0.28.1",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = false

# Optional: torch's default PyPI wheels for Linux pull the full CUDA
# runtime (~15 nvidia-cu13-* packages, several GB) even though this
# service only ever runs embedding inference on CPU. Uncomment the two
# blocks below and re-run `uv lock` on a machine that can reach
# download.pytorch.org (this sandbox can't, so it isn't verified here)
# to pin the CPU-only build instead:
#
# [tool.uv.sources]
# torch = [
#     { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
# ]
#
# [[tool.uv.index]]
# name = "pytorch-cpu"
# url = "https://download.pytorch.org/whl/cpu"
# explicit = true
