services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - ./RAG_service/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./RAG_service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./RAG_service/.env
    environment:
      # Overrides whatever POSTGRES_SERVER is set to in .env (likely
      # "localhost" for your native dev workflow). Inside the Compose
      # network the DB is reachable at the service name, not localhost.
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
